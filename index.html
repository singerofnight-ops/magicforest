<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Волшебный Фонарик - Охота за буквами</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap');

        :root {
            --bg-dark: #07131f; 
            --primary: #ff9800;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            font-family: 'Nunito', sans-serif;
            overflow: hidden; 
            background-color: var(--bg-dark);
            color: white;
            touch-action: none; 
        }

        /* --- ЭКРАН НАСТРОЕК --- */
        #setup-screen {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 100; padding: 20px; text-align: center;
        }

        .setup-box {
            background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px);
            padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            max-width: 600px; width: 100%;
        }

        h1 { font-size: 2.2rem; margin-bottom: 10px; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }
        p { font-size: 1.1rem; margin-bottom: 20px; color: #ddd; }

        input[type="text"] {
            width: 90%; padding: 15px; font-size: 1.5rem; border: 3px solid var(--primary);
            border-radius: 15px; outline: none; text-align: center; text-transform: uppercase;
            font-family: 'Nunito', sans-serif; font-weight: bold; color: #333; margin-bottom: 20px;
        }

        .mode-buttons { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

        button.btn {
            background-color: var(--primary); color: white; border: none; padding: 12px 20px;
            font-size: 1.2rem; border-radius: 20px; cursor: pointer; font-weight: 900;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2); transition: transform 0.2s, filter 0.2s;
            font-family: 'Nunito', sans-serif; min-width: 150px;
        }
        button.btn:hover { filter: brightness(1.1); transform: scale(1.05); }
        button.btn:active { transform: scale(0.95); }

        .btn-star { background-color: #673ab7; }
        .btn-frog1 { background-color: #4caf50; }
        .btn-air { background-color: #03a9f4; color: white; }

        .back-btn {
            position: absolute; top: 20px; left: 20px; z-index: 50;
            background: rgba(255,255,255,0.2); color: white; border: 2px solid white;
            padding: 10px 20px; border-radius: 20px; font-size: 1rem; font-weight: bold;
            cursor: pointer; backdrop-filter: blur(5px);
        }
        .back-btn:hover { background: rgba(255,255,255,0.4); }

        /* --- СООБЩЕНИЕ О ПОБЕДЕ --- */
        .win-message {
            display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            z-index: 100; background: rgba(0,0,0,0.8); padding: 40px; border-radius: 30px;
            text-align: center; border: 4px solid var(--primary); box-shadow: 0 0 50px var(--primary);
        }
        .win-message h2 { font-size: 3rem; color: #ffeb3b; margin: 0 0 20px 0; }

        /* ================= 1. ФОНАРИК ================= */
        #game-screen {
            display: none; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background-color: #0b141a;
        }
        #items-container { position: absolute; top: 0; left: 0; right: 0; bottom: 0; z-index: 10; }
        .game-item {
            position: absolute; font-size: 5rem; font-weight: 900; color: #fff; text-shadow: 0 0 20px rgba(255,255,255,0.5);
            cursor: pointer; user-select: none; transition: all 0.5s; display: flex; align-items: center; justify-content: center;
            transform: translate(-50%, -50%);
        }
        .game-item.found { font-size: 6rem; color: #ffeb3b; z-index: 20; transform: translate(-50%, -50%) scale(1.2) rotate(0deg) !important; }
        #flashlight-overlay {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0; z-index: 15; pointer-events: none;
            background: radial-gradient(circle at 50% 50%, transparent 80px, rgba(5, 10, 15, 0.98) 180px);
        }

        /* ================= 2. ЗВЕЗДОПАД ================= */
        #stars-screen {
            display: none; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(to bottom, #020111 10%, #20124d 100%); overflow: hidden;
        }
        .bg-star { position: absolute; background: white; border-radius: 50%; opacity: 0.5; animation: twinkle infinite alternate; }
        @keyframes twinkle { 0% { opacity: 0.2; transform: scale(0.8); } 100% { opacity: 0.8; transform: scale(1.2); } }
        .moon {
            position: absolute; top: 8%; right: 12%; width: 80px; height: 80px; border-radius: 50%;
            box-shadow: -15px 15px 0 0 #ffeb3b; filter: drop-shadow(0 0 25px rgba(255, 235, 59, 0.5)); z-index: 5;
        }
        #stars-container { position: absolute; top: 0; left: 0; right: 0; bottom: 0; z-index: 10; }
        .star-item {
            position: absolute; cursor: pointer; width: 120px; height: 120px; display: flex;
            align-items: center; justify-content: center; transform: translate(-50%, -50%); transition: transform 0.2s;
        }
        .star-item:hover { transform: translate(-50%, -50%) scale(1.1) !important; }
        .star-svg { width: 100%; height: 100%; filter: drop-shadow(0 0 15px rgba(255, 215, 0, 0.8)); }
        .star-letter {
            position: absolute; font-size: 3.5rem; font-weight: 900; color: #b71c1c;
            text-shadow: 2px 2px 0 #fff, -2px -2px 0 #fff, 2px -2px 0 #fff, -2px 2px 0 #fff; pointer-events: none;
        }
        .star-item.falling { animation: fallDown 1.5s forwards; pointer-events: none; }
        @keyframes fallDown { 100% { transform: translate(calc(-50% + 150px), 100vh) scale(0.5) rotate(180deg); opacity: 0; } }

        /* ================= 3. ЛЯГУШКА И МУХИ ================= */
        #flies-screen {
            display: none; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(to bottom, #e1f5fe 0%, #b3e5fc 30%, #c8e6c9 30%, #8bc34a 100%); overflow: hidden;
        }
        .frog-center {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 280px; height: 280px; display: flex; align-items: center; justify-content: center; z-index: 20; 
        }
        .cute-frog-svg {
            width: 100%; height: 100%; filter: drop-shadow(0 15px 15px rgba(0,0,0,0.2));
            animation: frogBreathe 3s infinite ease-in-out alternate;
        }
        @keyframes frogBreathe { 0% { transform: scale(1); } 100% { transform: scale(1.02) translateY(-5px); } }
        
        .frog-belly-letter {
            position: absolute; top: 62%; left: 50%; transform: translate(-50%, -50%);
            font-size: 4.5rem; font-weight: 900; color: #1b5e20; z-index: 25; pointer-events: none;
        }
        #flies-container { position: absolute; top: 0; left: 0; right: 0; bottom: 0; z-index: 30; }
        .fly-item {
            position: absolute; width: 140px; height: 140px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: filter 0.2s; animation: flyFloat 3s infinite ease-in-out alternate; transform-origin: center;
        }
        .fly-item:hover { filter: brightness(1.1) drop-shadow(0 0 10px rgba(255,255,255,0.5)); }
        .fly-svg { width: 100%; height: 100%; filter: drop-shadow(0 5px 5px rgba(0,0,0,0.2)); }
        @keyframes flyFloat {
            0% { transform: translate(-50%, -50%) rotate(-5deg); }
            100% { transform: translate(-50%, calc(-50% - 15px)) rotate(5deg); }
        }
        .frog-tongue {
            position: absolute; background-color: #ff5252; height: 12px; border-radius: 6px;
            transform-origin: left center; z-index: 40; display: none; box-shadow: 0 5px 5px rgba(0,0,0,0.2);
        }

        /* ================= 4. ВОЗДУШНЫЕ МУШКИ (С КРАСНОЙ РАМКОЙ) ================= */
        #air-flies-screen {
            display: none; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            /* Нежное голубое акварельное небо */
            background: linear-gradient(to bottom, #bbdefb 0%, #e1f5fe 50%, #f1f8e9 100%);
            overflow: hidden;
        }

        /* --- ДЕКОРАЦИИ ФОНА (Облака и Ветка) --- */
        .air-decorations {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 1; /* Самый нижний слой, под мухами */
        }

        .cute-cloud {
            position: absolute; fill: rgba(255, 255, 255, 0.9);
            filter: drop-shadow(0 10px 15px rgba(0,150,255,0.1));
        }
        .cloud-1 { top: 15%; left: -10%; width: 200px; animation: floatCloud 25s linear infinite alternate; }
        .cloud-2 { top: 45%; right: -5%; width: 150px; animation: floatCloud 35s linear infinite alternate-reverse; }
        .cloud-3 { top: 75%; left: 10%; width: 120px; animation: floatCloud 20s linear infinite alternate; opacity: 0.7; }
        
        @keyframes floatCloud {
            0% { transform: translateX(0); }
            100% { transform: translateX(50px); }
        }

        .cute-branch {
            position: absolute; top: -20px; right: -20px; width: 280px;
            transform-origin: top right;
            animation: swayBranch 6s ease-in-out infinite alternate;
            filter: drop-shadow(-5px 10px 10px rgba(0,0,0,0.15));
        }

        @keyframes swayBranch {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(4deg); }
        }

        /* Красная рамка с образцом буквы сверху */
        #air-target-box {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            width: 140px; height: 140px; border: 8px solid #ff0000;
            background-color: white; border-radius: 12px;
            display: flex; justify-content: center; align-items: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15); z-index: 20;
        }

        /* Шрифт с засечками как на референсе */
        #air-target-letter {
            font-size: 6rem; font-weight: bold; color: #333;
            font-family: 'Times New Roman', Times, serif; 
        }

        /* Скрываем всё, что вылетает за края экрана */
        #air-flies-container { position: absolute; top: 0; left: 0; right: 0; bottom: 0; z-index: 10; overflow: hidden; }

        /* Обертка для мухи (отвечает за движение снизу вверх) */
        .air-fly-wrapper {
            position: absolute; width: 130px; height: 130px; z-index: 10;
        }

        /* Внутренний блок мухи (отвечает за клики и анимацию исчезновения) */
        .air-fly-inner {
            width: 100%; height: 100%; cursor: pointer; transition: transform 0.2s;
        }
        .air-fly-inner:hover { transform: scale(1.15) !important; }
        
        .air-fly-svg {
            width: 100%; height: 100%; filter: drop-shadow(0 5px 8px rgba(0,0,0,0.2));
        }

        /* АНИМАЦИЯ: бесконечный полет снизу вверх с легким зигзагом */
        @keyframes flyUpwards {
            0% { top: 110%; transform: translateX(-20px) rotate(-10deg); }
            25% { transform: translateX(20px) rotate(10deg); }
            50% { transform: translateX(-20px) rotate(-10deg); }
            75% { transform: translateX(20px) rotate(10deg); }
            100% { top: -30%; transform: translateX(-20px) rotate(-10deg); }
        }

        /* Анимация пойманной мушки (магическое исчезновение) */
        .air-fly-inner.caught {
            transition: all 0.4s ease-out;
            transform: scale(1.5) rotate(360deg) !important;
            opacity: 0;
            filter: brightness(2) drop-shadow(0 0 20px yellow);
            pointer-events: none;
        }

    </style>
</head>
<body>

    <!-- ЭКРАН НАСТРОЕК -->
    <div id="setup-screen">
        <div class="setup-box">
            <h1>Игры с буквами 🎒</h1>
            <p>Впишите буквы (например: А О У М С):</p>
            <input type="text" id="letters-input" value="А О У М С" autocomplete="off">
            <br>
            <div class="mode-buttons">
                <button class="btn" onclick="startGame('flashlight')">🔦 Фонарик</button>
                <button class="btn btn-star" onclick="startGame('stars')">⭐ Звездопад</button>
                <button class="btn btn-frog1" onclick="startGame('flies')">🐸 Лягушка</button>
                <button class="btn btn-air" onclick="startGame('air')">🪰 Ловить мух (Рамка)</button>
            </div>
        </div>
    </div>

    <!-- 1. ФОНАРИК -->
    <div id="game-screen">
        <button class="back-btn" onclick="endGame()">🚪 Выйти</button>
        <div id="items-container"></div>
        <div id="flashlight-overlay"></div>
        <div id="win-message-flashlight" class="win-message"><h2>Все найдено! 🎉</h2><button class="btn" onclick="endGame()">Меню</button></div>
    </div>

    <!-- 2. ЗВЕЗДОПАД -->
    <div id="stars-screen">
        <button class="back-btn" onclick="endGame()">🚪 Выйти</button>
        <div class="moon"></div>
        <div id="bg-stars-container"></div>
        <div id="stars-container"></div>
        <div id="win-message-stars" class="win-message"><h2>Все звезды собраны! 🌟</h2><button class="btn btn-star" onclick="endGame()">Меню</button></div>
    </div>

    <!-- 3. ЛОБИТЬ МУХ (С ЛЯГУШКОЙ В ЦЕНТРЕ) -->
    <div id="flies-screen">
        <button class="back-btn" onclick="endGame()">🚪 Выйти</button>
        
        <div class="frog-center" id="flies-frog">
            <svg viewBox="0 0 200 200" class="cute-frog-svg">
                <path d="M10 160 Q 100 120 190 160 Q 100 200 10 160" fill="#4caf50"/>
                <path d="M100 160 L 70 140 L 100 180 Z" fill="#388e3c"/>
                <circle cx="50" cy="130" r="25" fill="#7cb342"/><circle cx="150" cy="130" r="25" fill="#7cb342"/>
                <path d="M 60 160 Q 40 170 50 180" fill="none" stroke="#7cb342" stroke-width="10" stroke-linecap="round"/>
                <path d="M 140 160 Q 160 170 150 180" fill="none" stroke="#7cb342" stroke-width="10" stroke-linecap="round"/>
                <ellipse cx="100" cy="120" rx="60" ry="50" fill="#8bc34a"/>
                <ellipse cx="100" cy="125" rx="40" ry="35" fill="#dcedc8"/>
                <ellipse cx="100" cy="70" rx="55" ry="40" fill="#8bc34a"/>
                <circle cx="65" cy="40" r="20" fill="#8bc34a"/><circle cx="135" cy="40" r="20" fill="#8bc34a"/>
                <circle cx="65" cy="40" r="14" fill="white"/><circle cx="135" cy="40" r="14" fill="white"/>
                <circle cx="65" cy="40" r="6" fill="#1b5e20"/><circle cx="135" cy="40" r="6" fill="#1b5e20"/>
                <circle cx="62" cy="37" r="2" fill="white"/><circle cx="132" cy="37" r="2" fill="white"/>
                <ellipse cx="55" cy="80" rx="8" ry="4" fill="#ffcdd2"/><ellipse cx="145" cy="80" rx="8" ry="4" fill="#ffcdd2"/>
                <path d="M 70 85 Q 100 105 130 85" fill="transparent" stroke="#33691e" stroke-width="4" stroke-linecap="round"/>
            </svg>
            <div class="frog-belly-letter" id="frog-belly-target">А</div>
        </div>
        <div class="frog-tongue" id="frog-tongue"></div>

        <div id="flies-container"></div>
        <div id="win-message-flies" class="win-message"><h2>Лягушка сыта! 🪰🐸</h2><button class="btn btn-frog1" onclick="endGame()">Меню</button></div>
    </div>

    <!-- 4. ВОЗДУШНЫЕ МУШКИ (ИГРА С КРАСНОЙ РАМКОЙ) -->
    <div id="air-flies-screen">
        <button class="back-btn" onclick="endGame()" style="color: #333; border-color: #333; z-index: 50;">🚪 Выйти</button>
        
        <!-- Красивый фон с облаками и веточкой -->
        <div class="air-decorations">
            <!-- Облако 1 -->
            <svg class="cute-cloud cloud-1" viewBox="0 0 100 50" xmlns="http://www.w3.org/2000/svg">
                <path d="M 20 40 Q 10 40 10 30 Q 10 15 25 20 Q 30 5 45 10 Q 55 -5 70 10 Q 85 10 90 25 Q 100 30 90 40 Z"/>
            </svg>
            <!-- Облако 2 -->
            <svg class="cute-cloud cloud-2" viewBox="0 0 100 50" xmlns="http://www.w3.org/2000/svg">
                <path d="M 20 40 Q 10 40 10 30 Q 10 15 25 20 Q 30 5 45 10 Q 55 -5 70 10 Q 85 10 90 25 Q 100 30 90 40 Z"/>
            </svg>
            <!-- Облако 3 -->
            <svg class="cute-cloud cloud-3" viewBox="0 0 100 50" xmlns="http://www.w3.org/2000/svg">
                <path d="M 20 40 Q 10 40 10 30 Q 10 15 25 20 Q 30 5 45 10 Q 55 -5 70 10 Q 85 10 90 25 Q 100 30 90 40 Z"/>
            </svg>
            
            <!-- Свисающая веточка справа -->
            <svg class="cute-branch" viewBox="0 0 200 300" xmlns="http://www.w3.org/2000/svg">
                <!-- Ветка -->
                <path d="M 220 -20 Q 120 100 30 180" fill="none" stroke="#795548" stroke-width="12" stroke-linecap="round"/>
                <path d="M 140 60 Q 90 140 80 180" fill="none" stroke="#795548" stroke-width="8" stroke-linecap="round"/>
                <!-- Листики -->
                <path d="M 30 180 Q 0 190 10 210 Q 40 210 30 180" fill="#aed581"/>
                <path d="M 80 180 Q 50 190 60 210 Q 90 200 80 180" fill="#8bc34a"/>
                <path d="M 140 60 Q 120 30 90 40 Q 110 70 140 60" fill="#8bc34a"/>
                <path d="M 100 120 Q 70 100 50 120 Q 80 140 100 120" fill="#aed581"/>
                <path d="M 180 30 Q 160 0 130 10 Q 150 40 180 30" fill="#aed581"/>
                <!-- Розовый цветочек -->
                <circle cx="95" cy="115" r="8" fill="#ff4081"/>
                <circle cx="108" cy="115" r="8" fill="#ff4081"/>
                <circle cx="102" cy="105" r="8" fill="#ff4081"/>
                <circle cx="102" cy="125" r="8" fill="#ff4081"/>
                <circle cx="102" cy="115" r="5" fill="#ffeb3b"/>
            </svg>
        </div>

        <!-- Красная рамка с образцом буквы -->
        <div id="air-target-box">
            <span id="air-target-letter">А</span>
        </div>
        
        <!-- Контейнер для мушек -->
        <div id="air-flies-container"></div>
        
        <div id="win-message-air" class="win-message">
            <h2 style="color: #ffeb3b; text-shadow: 2px 2px 4px #000;">Все мушки пойманы! 🪰✨</h2>
            <button class="btn btn-air" onclick="endGame()">Меню</button>
        </div>
    </div>

    <script>
        const dictionary = {
            'А': '🍉', 'Б': '🍌', 'В': '🚁', 'Г': '🍄', 'Д': '🏠', 'Е': '🦝', 'Ё': '🦔', 'Ж': '🦒', 'З': '☂️',
            'И': '🧸', 'Й': '🧘', 'К': '🐱', 'Л': '🦊', 'М': '🚗', 'Н': '✂️', 'О': '🐒', 'П': '🐧', 'Р': '🚀',
            'С': '🐘', 'Т': '🐯', 'У': '🐌', 'Ф': '🔦', 'Х': '🍞', 'Ц': '🐥', 'Ч': '🐢', 'Ш': '🎈', 'Щ': '🪥',
            'Э': '🚜', 'Ю': '🏕️', 'Я': '🍎'
        };

        // --- АУДИО ---
        const audio = {
            ctx: null,
            init() {
                if (!this.ctx) { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); }
                if (this.ctx.state === 'suspended') { this.ctx.resume(); }
            },
            play(type) {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.connect(gain); gain.connect(this.ctx.destination);
                const t = this.ctx.currentTime;
                
                if (type === 'click') {
                    osc.type = 'sine'; osc.frequency.setValueAtTime(600, t); osc.frequency.exponentialRampToValueAtTime(200, t + 0.1);
                    gain.gain.setValueAtTime(0.2, t); gain.gain.exponentialRampToValueAtTime(0.01, t + 0.1);
                    osc.start(); osc.stop(t + 0.1);
                } else if (type === 'magic') {
                    osc.type = 'triangle'; osc.frequency.setValueAtTime(400, t); osc.frequency.exponentialRampToValueAtTime(1200, t + 0.3);
                    gain.gain.setValueAtTime(0, t); gain.gain.linearRampToValueAtTime(0.3, t + 0.05); gain.gain.exponentialRampToValueAtTime(0.01, t + 0.3);
                    osc.start(); osc.stop(t + 0.3);
                } else if (type === 'slurp') {
                    osc.type = 'sine'; osc.frequency.setValueAtTime(600, t); osc.frequency.exponentialRampToValueAtTime(1500, t + 0.15);
                    gain.gain.setValueAtTime(0, t); gain.gain.linearRampToValueAtTime(0.4, t + 0.05); gain.gain.exponentialRampToValueAtTime(0.01, t + 0.2);
                    osc.start(); osc.stop(t + 0.2);
                } else if (type === 'error') {
                    osc.type = 'square'; osc.frequency.setValueAtTime(150, t); osc.frequency.exponentialRampToValueAtTime(100, t + 0.2);
                    gain.gain.setValueAtTime(0.1, t); gain.gain.exponentialRampToValueAtTime(0.01, t + 0.2);
                    osc.start(); osc.stop(t + 0.2);
                }
            },
            playWin() {
                if (!this.ctx) return;
                const notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, i) => {
                    const osc = this.ctx.createOscillator(); const gain = this.ctx.createGain();
                    osc.connect(gain); gain.connect(this.ctx.destination); osc.type = 'sine';
                    const t = this.ctx.currentTime + i * 0.15;
                    osc.frequency.setValueAtTime(freq, t); gain.gain.setValueAtTime(0, t);
                    gain.gain.linearRampToValueAtTime(0.3, t + 0.05); gain.gain.exponentialRampToValueAtTime(0.01, t + 0.5);
                    osc.start(t); osc.stop(t + 0.5);
                });
            }
        };

        // --- ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ ---
        let currentMode = '';
        let isGameRunning = false;
        let playLetters = [];
        let globalFoundCount = 0;

        const setupScreen = document.getElementById('setup-screen');
        const screens = {
            'flashlight': document.getElementById('game-screen'),
            'stars': document.getElementById('stars-screen'),
            'flies': document.getElementById('flies-screen'),
            'air': document.getElementById('air-flies-screen')
        };
        const wins = {
            'flashlight': document.getElementById('win-message-flashlight'),
            'stars': document.getElementById('win-message-stars'),
            'flies': document.getElementById('win-message-flies'),
            'air': document.getElementById('win-message-air')
        };

        // Исправленная главная функция, которая включает и выключает экраны
        function startGame(mode) {
            audio.init(); audio.play('click');
            
            const rawText = document.getElementById('letters-input').value.toUpperCase();
            let letters = rawText.match(/[А-ЯЁ]/g);

            if (!letters || letters.length === 0) { alert("Введите хотя бы одну букву!"); return; }

            playLetters = letters;
            currentMode = mode;
            isGameRunning = true;
            globalFoundCount = 0;

            setupScreen.style.display = 'none';
            Object.values(screens).forEach(s => s.style.display = 'none');
            Object.values(wins).forEach(w => w.style.display = 'none');
            
            screens[mode].style.display = 'block';

            if (mode === 'flashlight') initFlashlight();
            else if (mode === 'stars') initStars();
            else if (mode === 'flies') initFlies();
            else if (mode === 'air') initAirFlies();
        }

        function endGame() {
            audio.play('click');
            isGameRunning = false; currentMode = '';
            Object.values(screens).forEach(s => s.style.display = 'none');
            setupScreen.style.display = 'flex';
        }

        function checkWin(count, total) {
            if (count >= total) {
                setTimeout(() => {
                    audio.playWin();
                    wins[currentMode].style.display = 'block';
                }, 1000);
            }
        }

        // ================= МЕХАНИКА: НОВЫЕ ВОЗДУШНЫЕ МУШКИ (РАМКА) =================
        let airCurrentIdx = 0;
        let airFliesToCatch = 0;
        let airFliesCaught = 0;

        function initAirFlies() {
            airCurrentIdx = 0;
            renderAirFliesLevel();
        }

        function renderAirFliesLevel() {
            if (airCurrentIdx >= playLetters.length) { checkWin(1, 1); return; }
            
            const targetLetter = playLetters[airCurrentIdx];
            
            // Ставим букву в красную рамку наверху
            document.getElementById('air-target-letter').textContent = targetLetter;
            
            const container = document.getElementById('air-flies-container');
            container.innerHTML = '';

            airFliesToCatch = 3 + Math.floor(Math.random() * 2); // 3-4 правильные мухи
            airFliesCaught = 0;

            /* Создаем 6 независимых дорожек, чтобы мухи не сталкивались */
            const lanesCount = 6; 
            const totalFlies = lanesCount; 
            
            const allAlphabet = "АБВГДЕЖЗИКЛМНОПРСТУФХЦЧШЩЭЮЯ".split('');
            let levelLetters = [];
            
            // Заполняем правильными буквами
            for(let i = 0; i < airFliesToCatch; i++) {
                levelLetters.push(targetLetter);
            }
            
            // Добиваем остальные дорожки неправильными буквами
            while(levelLetters.length < totalFlies) {
                let randomLet = allAlphabet[Math.floor(Math.random()*allAlphabet.length)];
                if(randomLet !== targetLetter) levelLetters.push(randomLet);
            }
            levelLetters.sort(() => Math.random() - 0.5); // Перемешиваем по дорожкам

            // Вычисляем ширину одной дорожки (в процентах)
            const laneWidth = 100 / lanesCount;

            levelLetters.forEach((letter, index) => {
                const wrapper = document.createElement('div');
                wrapper.className = 'air-fly-wrapper';
                
                // Ставим муху строго по центру её личной дорожки
                const laneCenter = (index * laneWidth) + (laneWidth / 2);
                wrapper.style.left = `calc(${laneCenter}% - 65px)`; 
                
                // Рандомная скорость (СДЕЛАЛИ СИЛЬНО МЕДЛЕННЕЕ) и задержка старта
                const duration = 12 + Math.random() * 8; // Полет будет занимать от 12 до 20 секунд
                const delay = -(Math.random() * 12); 

                // Запускаем бесконечную анимацию полета вверх
                wrapper.style.animation = `flyUpwards ${duration}s linear infinite`;
                wrapper.style.animationDelay = `${delay}s`;

                const inner = document.createElement('div');
                inner.className = 'air-fly-inner';
                
                inner.innerHTML = `
                    <svg viewBox="0 0 100 100" class="air-fly-svg">
                        <path d="M50 45 Q 10 0 5 30 Q 25 60 50 45" fill="rgba(255,255,255,0.9)" stroke="#81d4fa" stroke-width="3"/>
                        <path d="M50 45 Q 90 0 95 30 Q 75 60 50 45" fill="rgba(255,255,255,0.9)" stroke="#81d4fa" stroke-width="3"/>
                        <ellipse cx="50" cy="55" rx="22" ry="30" fill="#37474f"/>
                        <circle cx="50" cy="28" r="14" fill="#263238"/>
                        <circle cx="43" cy="25" r="5" fill="white"/><circle cx="57" cy="25" r="5" fill="white"/>
                        <circle cx="43" cy="25" r="2" fill="black"/><circle cx="57" cy="25" r="2" fill="black"/>
                        <circle cx="50" cy="58" r="18" fill="#fff"/>
                        <text x="50" y="58" dy=".35em" text-anchor="middle" font-family="'Nunito', sans-serif" font-size="28" font-weight="900" fill="#b71c1c">${letter}</text>
                    </svg>
                `;

                inner.onclick = function() {
                    if (inner.classList.contains('caught')) return;

                    if (letter === targetLetter) {
                        inner.classList.add('caught');
                        audio.play('magic'); // Волшебный звук
                        
                        // Останавливаем полет этой мухи (застывает на месте и исчезает)
                        wrapper.style.animationPlayState = 'paused';
                        
                        airFliesCaught++;
                        if (airFliesCaught >= airFliesToCatch) {
                            setTimeout(() => {
                                airCurrentIdx++;
                                renderAirFliesLevel();
                            }, 800);
                        }
                    } else {
                        audio.play('error');
                        inner.style.filter = 'grayscale(1) opacity(0.5)';
                        setTimeout(() => inner.style.filter = '', 200);
                    }
                };
                
                wrapper.appendChild(inner);
                container.appendChild(wrapper);
            });
        }

        // ================= МЕХАНИКА: ЛЯГУШКА И МУХИ (В ЦЕНТРЕ) =================
        let fliesCurrentIdx = 0;
        let fliesToCatch = 0;
        let fliesCaught = 0;

        function initFlies() {
            fliesCurrentIdx = 0;
            renderFliesLevel();
        }

        function renderFliesLevel() {
            if (fliesCurrentIdx >= playLetters.length) { checkWin(1, 1); return; }
            
            const targetLetter = playLetters[fliesCurrentIdx];
            document.getElementById('frog-belly-target').textContent = targetLetter;
            
            const container = document.getElementById('flies-container');
            container.innerHTML = '';
            document.getElementById('frog-tongue').style.display = 'none';

            fliesToCatch = 3 + Math.floor(Math.random() * 2);
            fliesCaught = 0;

            const totalFlies = 10;
            const allAlphabet = "АБВГДЕЖЗИКЛМНОПРСТУФХЦЧШЩЭЮЯ".split('');
            let levelLetters = Array(fliesToCatch).fill(targetLetter);
            
            while(levelLetters.length < totalFlies) {
                let randomLet = allAlphabet[Math.floor(Math.random()*allAlphabet.length)];
                if(randomLet !== targetLetter) levelLetters.push(randomLet);
            }
            levelLetters.sort(() => Math.random() - 0.5);

            levelLetters.forEach((letter, index) => {
                const fly = document.createElement('div');
                fly.className = 'fly-item';
                
                fly.innerHTML = `
                    <svg viewBox="0 0 100 100" class="fly-svg">
                        <path d="M50 45 Q 10 0 5 30 Q 25 60 50 45" fill="rgba(255,255,255,0.9)" stroke="#81d4fa" stroke-width="3"/>
                        <path d="M50 45 Q 90 0 95 30 Q 75 60 50 45" fill="rgba(255,255,255,0.9)" stroke="#81d4fa" stroke-width="3"/>
                        <ellipse cx="50" cy="55" rx="22" ry="30" fill="#37474f"/>
                        <circle cx="50" cy="28" r="14" fill="#263238"/>
                        <circle cx="43" cy="25" r="5" fill="white"/><circle cx="57" cy="25" r="5" fill="white"/>
                        <circle cx="43" cy="25" r="2" fill="black"/><circle cx="57" cy="25" r="2" fill="black"/>
                        <circle cx="50" cy="58" r="18" fill="#fff"/>
                        <text x="50" y="58" dy=".35em" text-anchor="middle" font-family="'Nunito', sans-serif" font-size="28" font-weight="900" fill="#b71c1c">${letter}</text>
                    </svg>
                `;
                
                const angle = (index / totalFlies) * Math.PI * 2;
                const radiusX = 35 + Math.random() * 8; 
                const radiusY = 25 + Math.random() * 8; 
                let posX = 50 + Math.cos(angle) * radiusX;
                let posY = 55 + Math.sin(angle) * radiusY; 
                posX = Math.max(15, Math.min(85, posX));
                posY = Math.max(25, Math.min(80, posY));

                fly.style.left = posX + '%'; fly.style.top = posY + '%';
                fly.style.transform = `translate(-50%, -50%)`;
                fly.style.animationDelay = `-${Math.random()*4}s`; fly.style.animationDuration = `${2.5 + Math.random()*2}s`;

                fly.onclick = function(e) {
                    if (fly.classList.contains('caught')) return;
                    if (letter === targetLetter) {
                        fly.classList.add('caught'); catchFly(fly, e.clientX, e.clientY);
                    } else {
                        audio.play('error');
                        fly.style.filter = 'grayscale(1) opacity(0.5)';
                        setTimeout(() => fly.style.filter = '', 200);
                    }
                };
                container.appendChild(fly);
            });
        }

        function catchFly(flyElement, flyX, flyY) {
            audio.play('slurp');
            const tongue = document.getElementById('frog-tongue');
            const frogRect = document.getElementById('flies-frog').getBoundingClientRect();
            
            const startX = frogRect.left + frogRect.width / 2;
            const startY = frogRect.top + frogRect.height * 0.42; 
            
            const length = Math.sqrt(Math.pow(flyX - startX, 2) + Math.pow(flyY - startY, 2));
            const angle = Math.atan2(flyY - startY, flyX - startX) * 180 / Math.PI;

            tongue.style.display = 'block'; tongue.style.left = startX + 'px'; tongue.style.top = startY + 'px';
            tongue.style.width = '0px'; tongue.style.transform = `rotate(${angle}deg)`;

            setTimeout(() => { tongue.style.width = length + 'px'; }, 10);
            
            setTimeout(() => {
                flyElement.style.display = 'none'; tongue.style.width = '0px';
                fliesCaught++;
                if (fliesCaught >= fliesToCatch) {
                    setTimeout(() => { fliesCurrentIdx++; renderFliesLevel(); }, 600);
                }
            }, 200);
        }

        // ================= СТАРЫЕ МЕХАНИКИ (Фонарик и Звезды) =================
        function initFlashlight() {
            const container = document.getElementById('items-container');
            container.innerHTML = '';
            document.getElementById('flashlight-overlay').style.background = `radial-gradient(circle at 50% 50%, transparent 60px, rgba(5, 10, 15, 0.98) 160px)`;
            playLetters.forEach(letter => {
                const el = document.createElement('div'); el.className = 'game-item'; el.innerText = letter;
                el.style.top = Math.floor(Math.random() * 80) + 10 + '%'; el.style.left = Math.floor(Math.random() * 80) + 10 + '%';
                el.style.transform = `translate(-50%, -50%) rotate(${Math.floor(Math.random() * 40) - 20}deg)`;
                el.onclick = function() {
                    if (el.classList.contains('found')) return;
                    el.classList.add('found'); audio.play('magic');
                    document.getElementById('flashlight-overlay').style.background = 'transparent';
                    setTimeout(() => document.getElementById('flashlight-overlay').style.background = '', 300);
                    el.innerText = dictionary[letter] || '⭐';
                    globalFoundCount++; checkWin(globalFoundCount, playLetters.length);
                };
                container.appendChild(el);
            });
        }

        function updateFlashlight(x, y) {
            if (isGameRunning && currentMode === 'flashlight') {
                document.getElementById('flashlight-overlay').style.background = `radial-gradient(circle at ${x}px ${y}px, transparent 60px, rgba(5, 10, 15, 0.98) 160px)`;
            }
        }
        document.addEventListener('mousemove', e => updateFlashlight(e.clientX, e.clientY));
        document.addEventListener('touchmove', e => updateFlashlight(e.touches[0].clientX, e.touches[0].clientY));

        let placedStarsPositions = [];
        let bgStarsGenerated = false;
        function initStars() {
            const container = document.getElementById('stars-container');
            container.innerHTML = ''; placedStarsPositions = [];
            if (!bgStarsGenerated) {
                const bgContainer = document.getElementById('bg-stars-container');
                const colors = ['#ffffff', '#ffeb3b', '#b3e5fc', '#ffcdd2'];
                for (let i = 0; i < 70; i++) {
                    const star = document.createElement('div'); star.className = 'bg-star';
                    const size = Math.random() * 4 + 1;
                    star.style.width = `${size}px`; star.style.height = `${size}px`;
                    star.style.top = `${Math.random() * 100}%`; star.style.left = `${Math.random() * 100}%`;
                    star.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                    star.style.animationDelay = `${Math.random() * 3}s`; star.style.animationDuration = `${Math.random() * 2 + 1}s`;
                    bgContainer.appendChild(star);
                }
                bgStarsGenerated = true;
            }

            playLetters.forEach(letter => {
                const el = document.createElement('div'); el.className = 'star-item';
                const minDist = Math.max(12, 25 - playLetters.length);
                let top, left, valid = false, attempts = 0;
                while (!valid && attempts < 100) {
                    top = Math.floor(Math.random() * 70) + 15; left = Math.floor(Math.random() * 80) + 10; valid = true;
                    for (let pos of placedStarsPositions) {
                        if (Math.sqrt(Math.pow(pos.left - left, 2) + Math.pow(pos.top - top, 2)) < minDist) { valid = false; break; }
                    }
                    attempts++;
                }
                placedStarsPositions.push({top, left});
                el.style.top = top + '%'; el.style.left = left + '%';
                el.style.transform = `translate(-50%, -50%) scale(${0.8 + Math.random() * 0.4})`;
                el.innerHTML = `<svg class="star-svg" viewBox="0 0 51 48" xmlns="http://www.w3.org/2000/svg"><path fill="#FFD700" d="m25,1 6,17h18l-14,11 5,17-15-10-15,10 5-17-14-11h18z"/></svg><span class="star-letter">${letter}</span>`;
                el.onclick = function() {
                    if (el.classList.contains('falling')) return;
                    el.classList.add('falling'); audio.play('magic');
                    globalFoundCount++; checkWin(globalFoundCount, playLetters.length);
                };
                container.appendChild(el);
            });
        }
    </script>
</body>
</html>
